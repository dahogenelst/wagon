version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 10
    ignore:
      # internal gems come from dahogenelst/* via git and move through the CI cascade
      - dependency-name: 'locomotivecms*'
      - dependency-name: custom_fields
      # deferred on purpose: haml 7 changes the attribute quoting of .liquid.haml output (bump together with steam)
      - dependency-name: haml
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
